name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  package:
    name: Packed consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packed

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  postgres:
    name: Postgres integrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agntz
          POSTGRES_PASSWORD: agntz
          POSTGRES_DB: agntz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agntz -d agntz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agntz:agntz@localhost:5432/agntz_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - name: Build integration packages and workspace dependencies
        run: pnpm --filter @agntz/memrez... build
      - run: pnpm --filter @agntz/stores test
      - run: pnpm --filter @agntz/memrez test
      - name: Install Python Postgres dependencies
        working-directory: python
        run: python -m pip install -e '.[dev,postgres]'
      - name: Test Python Postgres integrations
        working-directory: python
        run: >-
          python -m pytest
          tests/test_postgres_store.py
          tests/test_memrez_postgres.py
          tests/test_namespace_root_store.py

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm turbo typecheck

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python SDK dependencies
        working-directory: python
        run: python -m pip install -e '.[dev]'

      - name: Test Python SDK
        working-directory: python
        run: python -m pytest

      - name: Lint Python SDK
        working-directory: python
        run: python -m ruff check .

      - name: Type check Python SDK
        working-directory: python
        run: python -m basedpyright

      - name: Build Python SDK
        working-directory: python
        run: python -m build
