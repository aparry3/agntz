name: NPM Baseline Release

on:
  workflow_dispatch:

concurrency: npm-baseline-release

jobs:
  publish:
    name: Publish npm baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish active public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          packages=(
            packages/contracts
            packages/db
            packages/client
            packages/core
            packages/stores
            packages/memrez
            packages/sdk
          )

          for dir in "${packages[@]}"; do
            echo "Publishing ${dir}"
            (cd "${dir}" && pnpm publish --access public --tag latest --no-git-checks --ignore-scripts)
          done

      - name: Force latest tags to baseline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          packages=(
            @agntz/contracts
            @agntz/db
            @agntz/client
            @agntz/core
            @agntz/stores
            @agntz/memrez
            @agntz/sdk
          )

          for package in "${packages[@]}"; do
            npm dist-tag add "${package}@0.0.0" latest
          done

      - name: Deprecate pre-baseline npm versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm deprecate '@agntz/client@>=0.1.0' 'Pre-baseline experimental release. Use @agntz/client@0.0.0 or newer.'
          npm deprecate '@agntz/core@>=0.1.0' 'Pre-baseline experimental release. Use @agntz/core@0.0.0 or newer.'
          npm deprecate '@agntz/memrez@>=0.1.0' 'Pre-baseline experimental release. Use @agntz/memrez@0.0.0 or newer.'
          npm deprecate '@agntz/sdk@>=0.1.0' 'Pre-baseline experimental release. Use @agntz/sdk@0.0.0 or newer.'
          npm deprecate '@agntz/manifest' 'Pre-baseline package retired. The manifest engine now ships from @agntz/core/manifest.'
          npm deprecate '@agntz/store-postgres' 'Pre-baseline package retired. Use @agntz/stores/postgres.'
          npm deprecate '@agntz/store-sqlite' 'Pre-baseline package retired. Use @agntz/stores/sqlite.'

      - name: Verify npm baseline
        run: |
          set -euo pipefail
          for package in @agntz/contracts @agntz/db @agntz/client @agntz/core @agntz/stores @agntz/memrez @agntz/sdk; do
            version="$(npm view "${package}" version)"
            if [ "${version}" != "0.0.0" ]; then
              echo "${package} latest resolved to ${version}, expected 0.0.0"
              exit 1
            fi
          done
