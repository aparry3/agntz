name: Provider smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live provider suite to run
        type: choice
        options:
          - smoke
          - compat
        default: smoke
  schedule:
    - cron: "17 9 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.suite || 'smoke' }}
  cancel-in-progress: false

jobs:
  provider-suite:
    name: Live provider suite
    runs-on: ubuntu-latest
    environment: provider-smoke
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build provider harness dependencies
        run: pnpm --filter @agntz/provider-harness... --if-present build

      - name: Install Python provider dependencies
        working-directory: python
        run: python -m pip install -e '.[litellm]'

      - name: Run live provider suite
        run: pnpm --filter @agntz/provider-harness test:${{ inputs.suite || 'smoke' }}

      - name: Upload provider reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-${{ inputs.suite || 'smoke' }}-${{ github.run_id }}
          path: apps/provider-harness/reports/
          if-no-files-found: warn
          retention-days: 30
