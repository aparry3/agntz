<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library vs. Application Separation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-dark" disabled>
<style>
  :root {
    --ink:#101828; --body:#344054; --muted:#667085; --faint:#98a2b3;
    --bg:#f6f8fb; --surface:#ffffff; --line:#d9e2ec; --line-soft:#e7edf3;
    --blue:#1d4ed8; --blue-bg:#eef4ff; --green:#087443; --amber:#b54708;
    --red:#b42318; --violet:#6941c6;
    --shadow:0 14px 40px rgba(16,24,40,.08); --radius:12px;
    --sidebar-w:288px; --content-max:840px;
  }
  html[data-theme="dark"] {
    --ink:#f0f3f9; --body:#c3ccd9; --muted:#94a0b3; --faint:#6b7687;
    --bg:#0f141b; --surface:#161d27; --line:#28323f; --line-soft:#212a36;
    --blue:#6ea0ff; --blue-bg:#16233b; --green:#56c08a; --amber:#e8a44b;
    --red:#f08a82; --violet:#b794f6;
    --shadow:0 14px 40px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; background:var(--bg); color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
  }
  code, pre, kbd { font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* Layout */
  .app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }
  .sidebar {
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--line);
    padding:22px 16px 40px; display:flex; flex-direction:column; gap:6px;
  }
  .brand { padding:6px 10px 14px; }
  .brand .kicker { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:600; }
  .brand h1 { font-size:18px; line-height:1.3; margin:4px 0 0; color:var(--ink); font-weight:700; }
  .nav-group-label { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:700; padding:14px 10px 6px; }
  .nav a.doc {
    display:block; padding:7px 10px; border-radius:8px; color:var(--body);
    font-size:13.5px; font-weight:500; line-height:1.35;
  }
  .nav a.doc:hover { background:var(--bg); text-decoration:none; }
  .nav a.doc.active { background:var(--blue-bg); color:var(--blue); font-weight:600; }
  .nav .toc { margin:2px 0 4px; padding-left:8px; border-left:2px solid var(--line-soft); }
  .nav .toc a { display:block; padding:4px 10px; font-size:12.5px; color:var(--muted); border-radius:6px; line-height:1.3; }
  .nav .toc a:hover { color:var(--ink); text-decoration:none; }
  .nav .toc a.h3 { padding-left:22px; font-size:12px; }
  .nav .toc a.active { color:var(--blue); font-weight:600; }

  .main { min-width:0; }
  .topbar {
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px;
    padding:0 28px; height:54px; background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line-soft);
  }
  .topbar .crumb { color:var(--muted); font-size:13px; font-weight:500; }
  .topbar .crumb b { color:var(--ink); font-weight:600; }
  .topbar .spacer { flex:1; }
  .topbar button {
    border:1px solid var(--line); background:var(--surface); color:var(--body);
    height:32px; padding:0 12px; border-radius:8px; font-size:12.5px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .topbar button:hover { border-color:var(--blue); color:var(--blue); }

  .content { max-width:var(--content-max); margin:0 auto; padding:34px 28px 120px; }

  /* Prose */
  .prose { color:var(--body); }
  .prose > *:first-child { margin-top:0; }
  .prose h1,.prose h2,.prose h3,.prose h4 { color:var(--ink); line-height:1.25; font-weight:700; scroll-margin-top:70px; }
  .prose h1 { font-size:30px; margin:0 0 8px; letter-spacing:-.01em; }
  .prose h2 { font-size:21px; margin:38px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line-soft); }
  .prose h3 { font-size:17px; margin:26px 0 8px; }
  .prose h4 { font-size:15px; margin:20px 0 6px; color:var(--body); }
  .prose p { margin:0 0 14px; }
  .prose ul,.prose ol { margin:0 0 14px; padding-left:24px; }
  .prose li { margin:5px 0; }
  .prose li::marker { color:var(--faint); }
  .prose a { font-weight:500; }
  .prose strong { color:var(--ink); font-weight:650; }
  .prose hr { border:0; border-top:1px solid var(--line); margin:32px 0; }
  .prose blockquote {
    margin:16px 0; padding:2px 18px; border-left:3px solid var(--blue);
    background:var(--blue-bg); border-radius:0 8px 8px 0; color:var(--body);
  }
  .prose blockquote p:last-child { margin-bottom:8px; }
  .prose blockquote p:first-child { margin-top:8px; }

  .prose :not(pre) > code {
    background:var(--blue-bg); color:var(--ink); padding:.12em .4em;
    border-radius:5px; font-size:.85em; border:1px solid var(--line-soft);
  }
  .prose pre {
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; overflow:auto; margin:0 0 16px; box-shadow:var(--shadow);
    font-size:13px; line-height:1.55;
  }
  .prose pre code { background:none; padding:0; border:0; font-size:inherit; color:var(--ink); }

  .prose table {
    width:100%; border-collapse:collapse; margin:0 0 18px; font-size:13.5px;
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  .prose th, .prose td { text-align:left; padding:9px 13px; border-bottom:1px solid var(--line-soft); }
  .prose th { background:var(--bg); color:var(--ink); font-weight:650; font-size:12.5px; }
  .prose tr:last-child td { border-bottom:0; }
  .prose td code { white-space:nowrap; }

  /* GFM task lists */
  .prose li.task-list-item { list-style:none; margin-left:-22px; padding-left:2px; }
  .prose li.task-list-item input { margin-right:8px; transform:translateY(1px); accent-color:var(--green); }

  /* Mermaid */
  .mermaid { margin:8px 0 22px; text-align:center; }
  .mermaid svg { max-width:100%; height:auto; }

  .heading-anchor { opacity:0; margin-left:8px; font-weight:400; color:var(--faint); font-size:.8em; }
  .prose h2:hover .heading-anchor, .prose h3:hover .heading-anchor { opacity:1; }

  /* Mobile */
  .menu-toggle { display:none; }
  .scrim { display:none; position:fixed; inset:0; z-index:15; background:rgba(16,24,40,.4); }
  @media (max-width:880px) {
    .app { grid-template-columns:1fr; }
    .sidebar {
      position:fixed; left:0; top:0; z-index:20; width:84vw; max-width:340px;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow);
    }
    html.nav-open .sidebar { transform:translateX(0); }
    html.nav-open .scrim { display:block; }
    .menu-toggle { display:inline-flex; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="kicker">Plan</div>
      <h1 id="plan-title">Library vs. Application Separation</h1>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
      <div class="crumb"><b id="crumb-title">—</b></div>
      <div class="spacer"></div>
      <button id="print-btn" title="Print / Save as PDF">Print</button>
      <button id="theme-btn" title="Toggle theme">◐ Theme</button>
    </div>
    <div class="content">
      <article class="prose" id="content"></article>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('plan-data').textContent);
  var DOCS = DATA.docs;
  var byId = {};
  DOCS.forEach(function (d) { byId[d.id] = d; });

  // Map filename/relpath -> doc id, for cross-doc link rewriting.
  var fileToId = {};
  DOCS.forEach(function (d) {
    if (d.stem) fileToId[d.stem.toLowerCase()] = d.id;
    if (d.rel) fileToId[d.rel.toLowerCase()] = d.id;
  });

  function b64decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function slug(text) {
    return text.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
  }

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'default' });
  }
  if (window.marked) {
    marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });
  }

  var contentEl = document.getElementById('content');
  var navEl = document.getElementById('nav');
  var crumbEl = document.getElementById('crumb-title');
  var current = null;

  // ---- Build sidebar nav ----
  function buildNav() {
    navEl.innerHTML = '';
    var lastGroup = '__none__';
    DOCS.forEach(function (d) {
      var g = d.group || null;
      if (g !== lastGroup && g) {
        var lbl = document.createElement('div');
        lbl.className = 'nav-group-label';
        lbl.textContent = g;
        navEl.appendChild(lbl);
        lastGroup = g;
      } else if (!g) {
        lastGroup = '__none__';
      }
      var a = document.createElement('a');
      a.className = 'doc';
      a.href = '#' + d.id;
      a.textContent = d.title;
      a.dataset.id = d.id;
      navEl.appendChild(a);
      var toc = document.createElement('div');
      toc.className = 'toc';
      toc.dataset.tocFor = d.id;
      navEl.appendChild(toc);
    });
  }

  // ---- Render a doc ----
  function renderDoc(id, anchor) {
    var doc = byId[id] || DOCS[0];
    if (!doc) return;
    current = doc.id;
    contentEl.innerHTML = marked.parse(b64decode(doc.md));
    crumbEl.textContent = doc.title;
    document.title = doc.title + ' · ' + DATA.title;

    // Heading ids + anchor links + collect TOC entries.
    var used = {};
    var tocItems = [];
    contentEl.querySelectorAll('h2, h3').forEach(function (h) {
      var base = slug(h.textContent);
      var s = base, n = 2;
      while (used[s]) { s = base + '-' + (n++); }
      used[s] = true;
      h.id = s;
      var a = document.createElement('a');
      a.className = 'heading-anchor';
      a.href = '#' + doc.id + ':::' + s;
      a.textContent = '#';
      h.appendChild(a);
      tocItems.push({ level: h.tagName === 'H3' ? 3 : 2, id: s, text: h.firstChild ? h.textContent.replace(/#$/, '') : h.textContent });
    });

    // Mermaid: convert ```mermaid code blocks into <div class="mermaid">.
    contentEl.querySelectorAll('code.language-mermaid').forEach(function (code) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      var pre = code.closest('pre');
      (pre || code).replaceWith(div);
    });
    if (window.mermaid) {
      try { mermaid.run({ nodes: contentEl.querySelectorAll('.mermaid') }); } catch (e) {}
    }

    // Highlight remaining code blocks.
    if (window.hljs) {
      contentEl.querySelectorAll('pre code').forEach(function (c) {
        try { hljs.highlightElement(c); } catch (e) {}
      });
    }

    // Rewrite cross-doc .md links to in-viewer hashes.
    contentEl.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:')) return;
      var m = href.match(/([^\/]+\.md)(#(.+))?$/i);
      if (!m) return;
      var targetId = fileToId[m[1].toLowerCase()] || fileToId[href.replace(/^\.\//, '').toLowerCase()];
      if (targetId) {
        a.setAttribute('href', '#' + targetId + (m[3] ? ':::' + slug(decodeURIComponent(m[3])) : ''));
      }
    });

    buildToc(doc.id, tocItems);
    setActiveDoc(doc.id);

    if (anchor) {
      var t = document.getElementById(anchor);
      if (t) { t.scrollIntoView(); return; }
    }
    document.querySelector('.content').scrollIntoView();
    window.scrollTo(0, 0);
  }

  function buildToc(docId, items) {
    document.querySelectorAll('.toc').forEach(function (t) {
      if (t.dataset.tocFor === docId) {
        t.innerHTML = '';
        items.forEach(function (it) {
          var a = document.createElement('a');
          a.className = it.level === 3 ? 'h3' : '';
          a.href = '#' + docId + ':::' + it.id;
          a.textContent = it.text;
          a.dataset.target = it.id;
          t.appendChild(a);
        });
      } else {
        t.innerHTML = '';
      }
    });
  }

  function setActiveDoc(id) {
    navEl.querySelectorAll('a.doc').forEach(function (a) {
      a.classList.toggle('active', a.dataset.id === id);
    });
  }

  // ---- Routing ----
  function parseHash() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!h) return { id: DOCS[0] && DOCS[0].id, anchor: null };
    var parts = h.split(':::');
    return { id: parts[0], anchor: parts[1] || null };
  }

  function onRoute() {
    var r = parseHash();
    if (!byId[r.id]) r.id = DOCS[0] && DOCS[0].id;
    if (r.id === current) {
      if (r.anchor) {
        var t = document.getElementById(r.anchor);
        if (t) t.scrollIntoView();
      }
      return;
    }
    renderDoc(r.id, r.anchor);
    closeNav();
  }

  window.addEventListener('hashchange', onRoute);

  // ---- Scroll spy for TOC ----
  var spyTimer = null;
  window.addEventListener('scroll', function () {
    if (spyTimer) return;
    spyTimer = setTimeout(function () {
      spyTimer = null;
      var heads = contentEl.querySelectorAll('h2, h3');
      var activeId = null;
      heads.forEach(function (h) {
        if (h.getBoundingClientRect().top < 120) activeId = h.id;
      });
      document.querySelectorAll('.toc a').forEach(function (a) {
        a.classList.toggle('active', a.dataset.target === activeId);
      });
    }, 80);
  }, { passive: true });

  // ---- Theme ----
  var themeBtn = document.getElementById('theme-btn');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('hljs-light').disabled = (t === 'dark');
    document.getElementById('hljs-dark').disabled = (t !== 'dark');
    try { localStorage.setItem('plan-theme', t); } catch (e) {}
  }
  themeBtn.addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('plan-theme'); } catch (e) {}
  applyTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  document.getElementById('print-btn').addEventListener('click', function () { window.print(); });

  // ---- Mobile nav ----
  function closeNav() { document.documentElement.classList.remove('nav-open'); }
  document.getElementById('menu-toggle').addEventListener('click', function () {
    document.documentElement.classList.toggle('nav-open');
  });
  document.getElementById('scrim').addEventListener('click', closeNav);

  // ---- Boot ----
  buildNav();
  onRoute();
})();
</script>
</body>
</html>
