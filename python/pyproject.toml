[project]
name = "agntz"
version = "0.3.0"
description = "Python SDK and hosted client for Agntz"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Agntz" }]
keywords = ["ai", "agents", "llm", "mcp", "yaml", "agent-framework"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://agntz.co"
Documentation = "https://agntz.co/docs"
Repository = "https://github.com/aparry3/agntz"
Issues = "https://github.com/aparry3/agntz/issues"
Changelog = "https://github.com/aparry3/agntz/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
litellm = [
  "litellm>=1.75.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
dev = [
  "build>=1.2.0",
  "basedpyright>=1.31.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
agntz-py = "agntz.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agntz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
